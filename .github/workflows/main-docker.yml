name: Deploy
on:
  workflow_call:


jobs:
  build:
    runs-on: self-hosted
    environment: CD
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get short sha
        run : IMAGE_TAG_SHA="${{ github.sha }}" && IMAGE_TAG_SHORT_SHA="${IMAGE_TAG_SHA:0:7}" && echo "${IMAGE_TAG_SHA:0:6}" >> tag

      - name: login
        run: make login --environment-overrides GHCR_TOKEN=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  USER_NAME=fargus3222


      - name: pull cache
        run: docker pull ghcr.io/homelabfargus/${{ github.event.repository.name }}:latest

      - name: build
        run: make build --environment-overrides IMAGE_NAME=${{ github.event.repository.name }} IMAGE_TAG=$(cat tag)
        
      - name: push_tag
        run: make push_tag --environment-overrides IMAGE_NAME=${{ github.event.repository.name }} IMAGE_TAG=$(cat tag)

      - name: push_latest
        run: make push_latest --environment-overrides IMAGE_NAME=${{ github.event.repository.name }} IMAGE_TAG=$(cat tag)

      - name: cd
        if: ${{ vars.IS_DEPLOYDED == 'true' }}
        run: make cd --environment-overrides GITHUB_TOKEN=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 MANIFEST_PATH_CI=${{ vars.MANIFEST_PATH }} CONTAINER_NAME=${{ vars.CONTAINER_NAME }} IMAGE_NAME=${{ github.event.repository.name }} IMAGE_TAG=$(cat tag)