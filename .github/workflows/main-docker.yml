name: Deploy
on:
  workflow_call:


jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: login
        run: make build --environment-overrides IMAGE_NAME=${{ github.event.repository.name }}
        
      - name: build
        run: make tag --environment-overrides IMAGE_NAME=${{ github.event.repository.name }} IMAGE_TAG=${{ github.sha }}

      - name: push
        run: make push --environment-overrides IMAGE_NAME=${{ github.event.repository.name }} IMAGE_TAG=${{ github.sha }}