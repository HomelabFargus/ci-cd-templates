name: Docker main ci-cd tmpl

on:
  workflow_call:
    inputs:
      context:
        type: string
        required: false
        default: "."
      dockerfile:
        type: string
        required: false
        default: "./Dockerfile"
      image_name:
        type: string
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: self-hosted
    env:
      REGISTRY: ghcr.io
      REGISTRY_TOKEN: ${{ vars.GHCR_TOKEN }}
      BUILD_CONTEXT: ${{ inputs.context }}
      BUILD_DOCKERFILE: ${{ inputs.dockerfile }}
      BUILD_IMAGE_NAME: ${{ inputs.image_name }}
      REPOSITORY: ${{ github.repository }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
      ACTOR: ${{ github.actor }}
      REF_NAME: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
      SHA: ${{ github.sha }}
      EVENT_NAME: ${{ github.event_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}

    steps:
      - name: Build and publish image with docker cli
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "Repository variable GHCR_TOKEN is not set"
            exit 1
          fi

          sanitize_tag() {
            echo "$1" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//'
          }

          owner="$(echo "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"

          if [ -n "${BUILD_IMAGE_NAME:-}" ]; then
            repo_name="$(echo "$BUILD_IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          else
            repo_name="$(echo "${REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          fi

          image="${REGISTRY}/${owner}/${repo_name}"
          short_sha="${SHA::12}"

          workdir="${RUNNER_TEMP}/docker-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$workdir"
          mkdir -p "$workdir"

          git init "$workdir"
          cd "$workdir"
          git remote add origin "https://x-access-token:${REGISTRY_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "${SHA}"
          git checkout --detach FETCH_HEAD

          tags=()

          if [ "$REF_TYPE" = "branch" ]; then
            branch_tag="$(sanitize_tag "$REF_NAME")"
            if [ -n "$branch_tag" ]; then
              tags+=("${image}:${branch_tag}")
            fi
          fi

          if [ "$REF_TYPE" = "tag" ]; then
            release_tag="$(sanitize_tag "$REF_NAME")"
            if [ -n "$release_tag" ]; then
              tags+=("${image}:${release_tag}")
            fi
          fi

          if [ -n "${PR_NUMBER:-}" ]; then
            tags+=("${image}:pr-${PR_NUMBER}")
          fi

          tags+=("${image}:sha-${short_sha}")

          if [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            tags+=("${image}:latest")
          fi

          mapfile -t unique_tags < <(printf '%s\n' "${tags[@]}" | awk '!seen[$0]++')

          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$ACTOR" --password-stdin

          cache_from_args=()
          if docker pull "${image}:latest"; then
            cache_from_args+=(--cache-from "${image}:latest")
          fi

          build_args=(docker build --pull -f "$BUILD_DOCKERFILE")

          for tag in "${unique_tags[@]}"; do
            build_args+=(-t "$tag")
          done

          build_args+=("${cache_from_args[@]}")
          build_args+=("$BUILD_CONTEXT")

          "${build_args[@]}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Pull request event detected, skip docker push"
            exit 0
          fi

          for tag in "${unique_tags[@]}"; do
            docker push "$tag"
          done
